services:
  db:
    image: postgres:17
    container_name: sweettour-db
    environment:
      POSTGRES_DB: integration_db1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d integration_db1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: sweettour-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: integration_db1
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: sweettour-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: